# ================================================================
# INTEGRACIÓN CON n8n VIA API DE DIFY
# Para que n8n pueda llamar al agente y responder en WhatsApp:
# ================================================================
#
# En n8n, usar el nodo HTTP Request con estos parámetros:
#
# URL:    https://api.dify.ai/v1/chat-messages
# Method: POST
# Headers:
#   Authorization: Bearer TU_DIFY_API_KEY
#   Content-Type: application/json
# Body (JSON):
# {
#   "inputs": {},
#   "query": "{{ $json.mensaje_del_cliente }}",
#   "response_mode": "blocking",
#   "conversation_id": "{{ $json.conversation_id || '' }}",
#   "user": "{{ $json.telefono_cliente }}"
# }
#
# La respuesta vendrá en: response.data.answer
# El conversation_id para mantener contexto: response.data.conversation_id
#
# ================================================================

# ================================================================
# VARIABLES DEL AGENTE (para recolectar datos del cliente)
# ================================================================
variables:
  - name: nombre_cliente
    type: string
    label: "Nombre del cliente"
    required: false
    default: ""

  - name: tipo_vehiculo
    type: select
    label: "Tipo de vehículo"
    options:
      - label: "Automóvil 4x2"
        value: "auto"
      - label: "SUV / 4x4"
        value: "suv"
    required: false

  - name: servicio_seleccionado
    type: select
    label: "Servicio elegido"
    options:
      - label: "Lavado básico + aspirado"
        value: "basico"
      - label: "Lavado + aspirado + encerado"
        value: "encerado"
      - label: "Detallado completo"
        value: "detallado"
    required: false

  - name: fecha_cita
    type: string
    label: "Fecha deseada"
    required: false

  - name: hora_cita
    type: string
    label: "Hora preferida"
    required: false

  - name: direccion_cliente
    type: string
    label: "Dirección del domicilio"
    required: false

  - name: telefono_cliente
    type: string
    label: "Número de WhatsApp"
    required: false

# ================================================================
